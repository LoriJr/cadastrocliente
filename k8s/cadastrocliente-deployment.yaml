apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadastrocliente
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cadastrocliente
  template:
    metadata:
      labels:
        app: cadastrocliente
    spec:
      containers:
        - name: cadastrocliente
          image: southamerica-east1-docker.pkg.dev/viratech-1010-508115/cadastrocliente-api-repo/cadastrocliente-app:v1
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/clientedb

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mail-username

            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mail-password

            - name: SERVER_PORT
              value: "8081"

            - name: APP_CORS_ALLOWED_ORIGIN
              value: "http://35.198.26.135"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z postgres 5432; do echo waiting for db; sleep 2; done;' ]